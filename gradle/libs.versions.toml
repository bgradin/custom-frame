navigationFragmentKtx = "2.9.3"
okhttp = "5.1.0"
roomRuntime = "2.7.2"
workRuntimeKtx = "2.10.3"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
